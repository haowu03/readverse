server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: readverse
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/readverse?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    hikari:
      maximum-pool-size: 16
      minimum-idle: 4
      connection-timeout: 3000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
      continue-on-error: false
  data:
    redis:
      host: localhost
      port: 6379
      password: readverse
      database: 0
      timeout: 3000ms
  rabbitmq:
    host: localhost
    port: 5672
    username: rv
    password: rv123456
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false

rv:
  redis:
    enabled: true
  jwt:
    secret: "readverse-demo-secret-key-please-change-in-production-2026"
    access-ttl-seconds: 1800
    refresh-ttl-seconds: 604800
    issuer: readverse
  cache:
    enabled: true
    local-ttl-seconds: 60
    chapter-ttl-seconds: 1800
    null-ttl-seconds: 120
    bloom-enabled: true
  rate-limit:
    enabled: true
  mq:
    enabled: false
  scheduler:
    enabled: false
  points:
    sign-in-base: 5
    continuous-seven-bonus: 20
    continuous-thirty-bonus: 100
  upload-path: ./uploads/

logging:
  level:
    com.readverse: info
    org.springframework.security: warn

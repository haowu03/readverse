name: readverse

services:
  mysql:
    image: mysql:8.0
    container_name: rv-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: readverse
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - rv-mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.2
    container_name: rv-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-readverse}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - rv-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-readverse}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rv-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rv}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rv123456}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rv-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 12

  # Optional: only needed if you switch rv.mq.enabled=true and want a management UI.
  # The application still runs with the local event bus by default.
  # xxl-job-admin:
  #   image: xuxueli/xxl-job-admin:2.4.1
  #   container_name: rv-xxl-job-admin
  #   profiles: ["xxl"]
  #   environment:
  #     PARAMS: >-
  #       --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
  #       --spring.datasource.username=root
  #       --spring.datasource.password=${MYSQL_ROOT_PASSWORD:-123456}
  #   ports:
  #     - "8858:8858"
  #   depends_on:
  #     mysql:
  #       condition: service_healthy

volumes:
  rv-mysql-data:
  rv-redis-data:
  rv-rabbitmq-data:
